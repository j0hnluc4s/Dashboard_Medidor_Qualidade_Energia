<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medidor de Energia</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="dashboard">

        <header class="header">
            <div>
                <h1>⚡ Medidor de Energia</h1>
                <p>Monitoramento e análise do consumo elétrico</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>
        </header>


        <section class="cards">

            <div class="card">
                <span class="card-title">Tensão</span>
                <strong id="voltage">220,4 V</strong>
            </div>

            <div class="card">
                <span class="card-title">Corrente</span>
                <strong id="current">3,21 A</strong>
            </div>

            <div class="card">
                <span class="card-title">Potência</span>
                <strong id="power">706 W</strong>
            </div>

        </section>


        <section class="content">

            <div class="chart-area">
                <h2>Potência ao longo do tempo</h2>
                <p>Histórico das últimas medições</p>

                <div class="chart-placeholder">
                    Gráfico será inserido aqui
                </div>
            </div>


            <div class="info-area">
                <h2>Informações</h2>

                <div class="info-row">
                    <span>Energia</span>
                    <strong>2,43 kWh</strong>
                </div>

                <div class="info-row">
                    <span>Fator de potência</span>
                    <strong>0,91</strong>
                </div>

                <div class="info-row">
                    <span>Frequência</span>
                    <strong>60 Hz</strong>
                </div>

            </div>

        </section>

    </main>


    <script src="js/main.js"></script>

</body>

</html>
